<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rundenkampf-Studio</title>
  <meta name="description" content="Level, Objekte, Allys und Gegner erstellen und im Test-Modus ausprobieren.">
  <meta name="theme-color" content="#101116">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rundenkampf">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⚔️ Rundenkampf-Studio</div>
    <nav class="tabs" id="tabs">
      <span class="tab-group-label">Erstellen</span>
      <button data-view="levels">🗺️ Level</button>
      <button data-view="objects">🧪 Objekte</button>
      <button data-view="allies">🛡️ Allys</button>
      <button data-view="enemies">👹 Gegner</button>
      <span class="tab-sep"></span>
      <button data-view="test" class="tab-test">🎯 Test-Modus</button>
    </nav>
    <div class="data-menu">
      <button id="btn-install" class="primary" hidden title="Als App auf diesem Gerät installieren">📲 Installieren</button>
      <button id="btn-export" title="Alle Daten als JSON-Datei speichern">⬇ Export</button>
      <label class="btn" title="JSON-Datei laden">⬆ Import<input type="file" id="file-import" accept=".json,application/json" hidden></label>
      <button id="btn-samples" title="Beispieldaten laden (überschreibt alles)">Beispiele</button>
      <button id="btn-clear" class="danger" title="Alle Daten löschen">Leeren</button>
    </div>
  </header>

  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="js/map.js"></script>
  <script src="js/data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/testmode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
