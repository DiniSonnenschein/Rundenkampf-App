<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rundenkampf-Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⚔️ Rundenkampf-Studio</div>
    <nav class="tabs" id="tabs">
      <span class="tab-group-label">Erstellen</span>
      <button data-view="levels">🗺️ Level</button>
      <button data-view="objects">🧪 Objekte</button>
      <button data-view="allies">🛡️ Allys</button>
      <button data-view="enemies">👹 Gegner</button>
      <span class="tab-sep"></span>
      <button data-view="test" class="tab-test">🎯 Test-Modus</button>
    </nav>
    <div class="data-menu">
      <button id="btn-export" title="Alle Daten als JSON-Datei speichern">⬇ Export</button>
      <label class="btn" title="JSON-Datei laden">⬆ Import<input type="file" id="file-import" accept=".json,application/json" hidden></label>
      <button id="btn-samples" title="Beispieldaten laden (überschreibt alles)">Beispiele</button>
      <button id="btn-clear" class="danger" title="Alle Daten löschen">Leeren</button>
    </div>
  </header>

  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/testmode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
